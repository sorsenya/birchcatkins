<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>Схема территории — СНТ «Летняя Березка»</title>
<style>
  :root{
    --accent:#3068c2;
    --accent-dark:#204a91;
    --accent-light:#e8eefb;
    --text-main:#233029;
    --text-muted:#6b7a73;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text-main);
    background:#fff;
  }

  .territory-section{
    max-width:1100px;
    margin:0 auto;
    padding:32px 20px 48px;
  }

  .territory-header{
    text-align:center;
    margin-bottom:22px;
  }

  .territory-header h2{
    font-size:28px;
    font-weight:700;
    margin:0 0 8px;
    color:var(--text-main);
    letter-spacing:-.02em;
  }

  .territory-header p{
    margin:0;
    color:var(--text-muted);
    font-size:15px;
    line-height:1.5;
  }

  .territory-toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:22px 0 16px;
  }

  .roads-toggle{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--accent-light);
    border:1px solid #c8d7f2;
    border-radius:999px;
    padding:8px 16px 8px 8px;
    cursor:pointer;
    user-select:none;
    transition:background .15s ease,border-color .15s ease;
  }

  .roads-toggle:hover{border-color:var(--accent);}

  .roads-toggle .switch{
    width:38px;
    height:22px;
    border-radius:999px;
    background:#c7d3cd;
    position:relative;
    transition:background .2s ease;
    flex:none;
  }

  .roads-toggle .switch::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .2s ease;
  }

  .roads-toggle input{display:none;}

  .roads-toggle input:checked + .switch{background:var(--accent);}

  .roads-toggle input:checked + .switch::after{
    transform:translateX(16px);
  }

  .roads-toggle span.label-text{
    font-size:14px;
    font-weight:600;
    color:var(--text-main);
    white-space:nowrap;
  }

  .map-wrapper{
    position:relative;
    border:1px solid #e3e9e5;
    border-radius:20px;
    background:#fff;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y pinch-zoom;
    max-height:75vh;
  }

  .map-inner{
    width:100%;
    min-width:100%;
    position:relative;
  }

  #territory-svg{
    display:block;
    width:100%;
    height:auto;
  }

  .map-base,
  .map-roads-grey,
  .map-roads-highlight{
    pointer-events:none;
  }

  .map-roads-grey{
    opacity:.85;
  }

  .map-roads-highlight.active{
    opacity:1;
  }

  .legend{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    font-size:13px;
    color:var(--text-muted);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .2s ease;
  }

  .legend.visible{
    opacity:1;
    max-height:60px;
  }

  .legend .swatch{
    width:22px;
    height:10px;
    border-radius:4px;
    background:var(--accent);
    flex:none;
  }

  @media (max-width:640px){
    .territory-header h2{font-size:22px;}
    .territory-section{padding:20px 12px 36px;}
    .map-wrapper{border-radius:14px;max-height:65vh;}
  }
</style>
</head>

<body>
<section class="territory-section">

  <div class="territory-header">
    <h2>Схема территории</h2>
  </div>

  <div class="territory-toolbar">
    <label class="roads-toggle" for="roadsToggle">
      <input type="checkbox" id="roadsToggle">
      <span class="switch"></span>
      <span class="label-text">❄️ Зимняя уборка дорог</span>
    </label>
  </div>

  <div class="map-wrapper" id="mapWrapper">
    <div class="map-inner" id="mapInner">
      <svg id="territory-svg"
           viewBox="0 0 1557 3151"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="Схема территории СНТ Летняя Березка">

        <!--
          ВАЖНО:
          map-base.png и map-roads.png — точные слои исходной схемы.
          Поэтому визуальное расположение участков и дорог НЕ генерируется
          заново браузером и не зависит от приблизительных SVG-координат.
        -->
        <image
          class="map-base"
          href="map-base.png"
          x="0" y="0"
          width="1557" height="3151"
          preserveAspectRatio="none"
        />

        <image
          id="roadsImageGrey"
          class="map-roads-grey"
          href="map-roads-grey.png"
          x="0" y="0"
          width="1557" height="3151"
          preserveAspectRatio="none"
        />

        <image
          id="roadsImageHighlight"
          class="map-roads-highlight"
          href="map-roads-highlight.png"
          x="0" y="0"
          width="1557" height="3151"
          preserveAspectRatio="none"
        />

      </svg>
    </div>
  </div>

  <div class="legend" id="roadsLegend">
    <span class="swatch"></span>
    <span>Синим показаны участки дорог, которые планируется очищать зимой.</span>
  </div>

</section>

<script>
/*
 * Карта полностью статична: участки не кликабельны,
 * никаких подсказок или деталей по нажатию не показывается.
 * Масштабирование выполняется нативным жестом "два пальца" (pinch-to-zoom).
 */

const roadsToggle = document.getElementById("roadsToggle");
const roadsImageHighlight = document.getElementById("roadsImageHighlight");
const roadsLegend = document.getElementById("roadsLegend");

roadsToggle.addEventListener("change", () => {
  roadsImageHighlight.classList.toggle("active", roadsToggle.checked);
  roadsLegend.classList.toggle("visible", roadsToggle.checked);
});
</script>
</body>
</html>
